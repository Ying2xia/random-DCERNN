# Confirmatory IID primary experiment.  This protocol is independent of the
# exploratory one- and three-round tuning ledgers and is the only source for
# the revised manuscript's primary simulation tables.
experiment:
  name: fedcernn_primary_t3_confirmatory
  repetitions: 100
  base_seed: 20260811
  output_directory: results/revision_primary_t3_rebuild
  torch_threads: 1
  fail_fast: false
  # Retry only rows previously marked as errors; successful run keys remain
  # immutable. This lets an interrupted or interpreter-incompatible run be
  # recovered without changing the simulation design or seeds.
  retry_errors: true

dataset: simulation
seed_policy: shared_primary_v1
seed_base_by_dgp:
  correlated_interaction: 20260829
simulation:
  n_train: 100000
  n_test: 5000
  n_clients: 20
  dgps: [smooth_additive, correlated_interaction, sparse_interaction]
  errors: [normal, t3, centered_chi2, contaminated_normal]
  partition: {kind: iid}

model:
  hidden_dims: [32, 16]
  taus: [0.1, 0.3, 0.5, 0.7, 0.9]

optimization:
  l2_lambda: 0.0001
  adam_steps: 400
  adam_lr: 0.01
  lbfgs_steps: 800
  lbfgs_lr: 1.0
  tolerance: 1.0e-6
  history_size: 100
  stepwise_lbfgs: false
  select_min_gradient_checkpoint: false

# Three rounds are fixed after the seed-separated round-budget validation.
fedcernn:
  rounds: 3
  host_optimizer:
    adam_steps: 200
    adam_lr: 0.01
    lbfgs_steps: 400
    lbfgs_lr: 1.0
    tolerance: 1.0e-6
    history_size: 50
  surrogate_optimizer:
    adam_steps: 3
    adam_lr: 0.001
    lbfgs_steps: 5
    lbfgs_lr: 0.02
    tolerance: 1.0e-6
    history_size: 10
    stepwise_lbfgs: true
    select_min_gradient_checkpoint: true
    max_rms_parameter_change: 0.005

baselines:
  rounds: 5
  # DCERNN uses 5 x 300 communicated global-gradient steps. This value was
  # selected from the seed-separated {30,100,300} x {0.001,0.003,0.01} grid.
  local_steps: 300
  local_lr: 0.01
  fedprox_mu: 0.01
  cease_alpha: 0.01
  feddane_mu: 0.01
  local_optimizer:
    adam_steps: 3
    adam_lr: 0.001
    lbfgs_steps: 5
    lbfgs_lr: 0.02
    tolerance: 1.0e-6
    history_size: 10
    stepwise_lbfgs: true
    select_min_gradient_checkpoint: true
    max_rms_parameter_change: 0.005
  # Uncorrected predictive baselines must not inherit the short safeguarded
  # surrogate solve above. These profiles were selected on the seed-separated
  # five-repetition tuning ledger before the reportable rebuild.
  predictive_local_optimizer:
    adam_steps: 300
    adam_lr: 0.003
    lbfgs_steps: 0
    lbfgs_lr: 1.0
    tolerance: 1.0e-7
    history_size: 20
  predictive_local_optimizers:
    SCAFFOLD:
      adam_steps: 100
      adam_lr: 0.003
      lbfgs_steps: 0
      lbfgs_lr: 1.0
      tolerance: 1.0e-7
      history_size: 20

participation:
  rate: 1.0
  seed: 20260811

methods:
  - FedCERNN
  - FedCERNN-T5
  - CEASE-CERNN
  - DANE-CERNN
  - FedDANE-CERNN
  - Intercept-only
  - Centralized CERNN
  - Host CERNN
  - one-shot FedAvg
  - multi-round FedAvg
  - FedProx
  - SCAFFOLD
  - DCERNN

sensitivity: {enabled: false}
